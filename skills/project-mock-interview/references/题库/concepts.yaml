# 面试题库概念词典 —— 知识图谱的枢纽层
# 结构: concepts[] 每个概念含 name(唯一,即笔记文件名)/aliases(展示别名)/keywords(匹配关键词,命中题目文本即建立连接)/summary(定义摘要,写入概念笔记)/related(概念间人工维护的相关边)
# 匹配规则: 大小写不敏感子串匹配(latin), 中文直接子串匹配; 一条题目最多连 5 个概念(按命中顺序取前5,避免毛球化)
concepts:
  - name: MCP
    aliases: [模型上下文协议, Model Context Protocol]
    keywords: [MCP, 模型上下文协议, Model Context Protocol]
    summary: 统一大模型与外部工具/数据源的标准化连接协议；本质是把工具接入从各家私有协议变成"标准接口 + 注册发现"，核心设计思想是协议层解耦。
    related: [Tool Calling 与 Function Calling, 路由机制, 技能体系]
  - name: Tool Calling 与 Function Calling
    aliases: [工具调用, 函数调用, FunctionCalling, ToolCalling]
    keywords: [工具调用, Tool Calling, ToolCalling, Function Calling, FunctionCalling, 函数调用, 工具参数, 工具链]
    summary: 模型按结构化 schema 生成调用外部工具的指令；关键难点是参数生成可靠性、纠错机制与跨域工具编排。
    related: [MCP, 技能体系, 意图识别与分发]
  - name: RAG 与知识库
    aliases: [检索增强生成, 知识库, 向量检索]
    keywords: [RAG, 检索增强生成, 知识库, 文档解析, Chunking, 切分, 召回, 知识图谱]
    summary: 先检索后生成的架构范式；完整链路含解析/切分/索引/检索/生成与后校验，核心权衡是召回率与幻觉噪声的平衡。
    related: [Agentic RAG, 混合检索与重排, 向量数据库与 HNSW]
  - name: Agentic RAG
    aliases: [智能体检索增强, 智能体 RAG]
    keywords: [Agentic RAG, 智能体检索]
    summary: 由 Agent 自主决策检索时机、改写与多轮检索的 RAG 演进形态；与传统 RAG 的本质区别在"检索成为可规划的决策动作"。
    related: [RAG 与知识库, Query 改写, Multi-Agent 多智能体协作]
  - name: ReAct 与 Agent 工作流范式
    aliases: [ReAct, 思考行动观察循环, Execution Loop]
    keywords: [ReAct, Execution Loop, 思考-行动-观察, 工作流范式, Plan-and-Execute, 范式]
    summary: ReAct 是"思考-行动-观察"交替的推理范式；与 Plan-and-Execute、Reflection 等的区别在于决策粒度与规划方式。
    related: [LangGraph 与图编排, 思维链与推理提示]
  - name: 思维链与推理提示
    aliases: [CoT, 思维链, 思维树, ToT, GoT, 思维图]
    keywords: [思维链, CoT, Chain of Thought, 思维树, ToT, 思维图, GoT, 复杂推理]
    summary: 通过显式中间推理步骤提升复杂任务表现的技术族；CoT 线性、ToT 树状搜索、GoT 图结构，按任务复杂度递进。
    related: [Prompt Engineering, ReAct 与 Agent 工作流范式]
  - name: LangGraph 与图编排
